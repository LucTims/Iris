# Fabrique la vidéo TikTok du jour « Devine son métier ». Lancé par n8n (repository_dispatch « iris-video »)
# avec l'idée choisie dans la banque Supabase ; à la fin, produire.mjs rappelle n8n qui l'envoie sur Telegram.
# Lancement manuel possible (onglet Actions) en collant le JSON de l'épisode.
name: Vidéo Iris

on:
  repository_dispatch:
    types: [iris-video]
  workflow_dispatch:
    inputs:
      episode:
        description: 'JSON {"idee_id":…, "essai":…, "contenu":{…}}'
        required: true

concurrency:
  group: iris-video
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            marketing/automation-iris
            marketing/studio-tiktok/outils

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: marketing/automation-iris/requirements.txt

      - name: Modèle de détourage (cache)
        uses: actions/cache@v4
        with:
          path: ~/.rembg
          key: rembg-isnet-general-use

      - name: Outils
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q -r marketing/automation-iris/requirements.txt
          npm install -g playwright@1.63.0 --silent
          npx -y playwright@1.63.0 install --with-deps chromium >/dev/null
          bash marketing/studio-tiktok/outils/installer.sh "$RUNNER_TEMP/outils"

      - name: Vidéo
        env:
          EPISODE_JSON: ${{ github.event_name == 'repository_dispatch' && toJSON(github.event.client_payload) || inputs.episode }}
          OUTILS: ${{ runner.temp }}/outils
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          N8N_RAPPEL_URL: https://n8n-with-ai-assistant-qgyz.srv1928272.hstgr.cloud/webhook/iris-video-prete
          N8N_RAPPEL_SECRET: ${{ secrets.N8N_RAPPEL_SECRET }}
        run: node marketing/automation-iris/produire.mjs "$RUNNER_TEMP/travail"

      - name: Aperçus (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: travail
          path: |
            ${{ runner.temp }}/travail/raw
            ${{ runner.temp }}/travail/p
            ${{ runner.temp }}/travail/params.json
          retention-days: 3
          if-no-files-found: ignore
