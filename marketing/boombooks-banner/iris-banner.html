<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bannière Iris</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* Page de démonstration uniquement : sur BoomBooks, ne copier que le
     bloc <style> "iris-promo" ci-dessous et la <section class="iris-promo">. */
  body { margin: 0; padding: 24px 16px; background: #ffffff; }
  .demo-wrap { max-width: 1180px; margin: 0 auto; }
</style>

<!-- ===================== DÉBUT BANNIÈRE IRIS (CSS) ===================== -->
<style>
  .iris-promo {
    --ip-bg: #f3ece6;
    --ip-ink: #161616;
    --ip-muted: #3d3a37;
    --ip-brand: #bf6345;
    --ip-brand-dark: #a24f34;
    container-type: inline-size;
    box-sizing: border-box;
    width: 100%;
    background: var(--ip-bg);
    color: var(--ip-ink);
    font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  .iris-promo *, .iris-promo *::before, .iris-promo *::after { box-sizing: inherit; }

  /* Mobile d'abord : illustration en haut, texte en dessous (comme Kobo). */
  .iris-promo__inner {
    display: flex;
    flex-direction: column-reverse;
    gap: 20px;
    padding: 20px 16px 24px;
  }
  .iris-promo__art { width: 100%; }
  .iris-promo__art svg { display: block; width: 100%; height: auto; }

  .iris-promo__eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    margin: 0 0 10px;
    font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    color: var(--ip-brand-dark);
  }
  .iris-promo__eyebrow svg { width: 4px; height: auto; flex: none; }
  .iris-promo__title {
    margin: 0 0 10px;
    font-family: "Newsreader", Georgia, "Times New Roman", serif;
    font-weight: 500;
    font-size: 26px;
    line-height: 1.15;
    letter-spacing: -0.01em;
    color: var(--ip-ink);
  }
  .iris-promo__title em { font-style: italic; color: var(--ip-brand); }
  .iris-promo__text {
    margin: 0 0 20px;
    font-size: 16px; line-height: 1.5;
    color: var(--ip-muted);
    max-width: 34em;
  }
  .iris-promo__cta {
    display: inline-block;
    padding: 14px 22px;
    background: var(--ip-ink);
    color: #fff !important;
    font-weight: 700; font-size: 15px; line-height: 1.2;
    text-decoration: none !important;
    border-radius: 2px;
    transition: background-color .2s ease;
  }
  .iris-promo__cta:hover, .iris-promo__cta:focus-visible { background: var(--ip-brand-dark); }
  .iris-promo__cta:focus-visible { outline: 3px solid var(--ip-brand); outline-offset: 3px; }
  .iris-promo__note { margin: 12px 0 0; font-size: 13px; color: #6b6560; }

  /* Tablette / bureau : texte à gauche, illustration à droite. */
  @container (min-width: 720px) {
    .iris-promo__inner {
      flex-direction: row;
      align-items: center;
      gap: 32px;
      padding: 40px 40px 40px 56px;
    }
    .iris-promo__copy { flex: 0 0 38%; }
    .iris-promo__art { flex: 1 1 auto; min-width: 0; }
    .iris-promo__title { font-size: clamp(30px, 4.4cqi, 46px); }
    .iris-promo__text { font-size: 17px; }
  }
  @container (min-width: 1000px) {
    .iris-promo__inner { padding: 48px 48px 48px 72px; gap: 48px; }
  }
  @media (prefers-reduced-motion: reduce) { .iris-promo__cta { transition: none; } }
</style>
<!-- ====================== FIN BANNIÈRE IRIS (CSS) ====================== -->
</head>
<body>
